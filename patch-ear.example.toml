# A whole patch-press Configs tree (<library>/<subfolders>/<preset>.yaml): library samples, Kontakt/SFZ/Bitwig maps,
# wavetables and CLAP/VST3 presets, all measured through patch-press's own adapters. Needs `uv sync --extra press`.
# [[source]]
# name = "library"
# type = "press"
# path = "/path/to/prepare-sd-cards/output/Configs"
# only_list = "subset.txt"   # optional: config paths without .yaml, one per line, `*` allowed (e.g. "Diva/1 BASS/*")
# ref_midi = 45              # real pitch to measure at (MIDI 45 = A2, 110 Hz)
